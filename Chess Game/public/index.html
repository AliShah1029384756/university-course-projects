<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Chess Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Multiplayer Chess</h1>
      <p>Play chess with friends online using socket programming</p>
    </header>
    
    <div class="lobby-container" id="lobbyContainer">
      <h2 class="lobby-title">Game Lobby</h2>
      
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="text" placeholder="Enter your username" class="form-input">
      </div>
      
      <div class="form-group">
        <label for="roomName" class="form-label">Room Name</label>
        <input id="roomName" type="text" placeholder="Enter room name" class="form-input">
      </div>
      
      <div class="button-container">
        <button id="createRoomButton" class="button">Create Room</button>
        <button id="joinRoomButton" class="button">Join Room</button>
      </div>
      
      <div class="available-rooms">
        <h3>Available Rooms</h3>
        <ul id="roomsList" class="rooms-list">
          <li class="room-item">No rooms available</li>
        </ul>
      </div>
    </div>
    
    <div class="game-container" id="gameContainer" style="display: none;">
      <div class="sidebar">
        <h2>Players</h2>
        <div class="timer-container">
          <div class="timer white-timer">
            <div class="timer-label">White</div>
            <div class="timer-value" id="whiteTimer">10:00</div>
          </div>
          <div class="timer black-timer">
            <div class="timer-label">Black</div>
            <div class="timer-value" id="blackTimer">10:00</div>
          </div>
        </div>
        <ul id="usersList"></ul>
        <div class="user-count"></div>
      </div>
      
      <div class="board-container">
        <div class="board-header">
          <div class="player-info" id="blackPlayerInfo">
            <div class="player-color black-color"></div>
            <span id="blackPlayerName">Black</span>
          </div>
          <div class="player-info" id="gameStatus">
            Game in progress
          </div>
          <div class="player-info" id="whitePlayerInfo">
            <div class="player-color white-color"></div>
            <span id="whitePlayerName">White</span>
          </div>
        </div>
        
        <div class="chessboard"></div>
        
        <div class="status-container">
          <div class="status"></div>
          <div class="message"></div>
        </div>
        
        <div class="game-controls">
          <button class="control-button resign" id="resignButton">Resign</button>
          <button class="control-button draw" id="offerDrawButton">Offer Draw</button>
        </div>
        
        <div class="turn-popup"></div>
      </div>
      
      <div class="chat-container">
        <h2>Chat</h2>
        <div class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" type="text" placeholder="Type your message..." autocomplete="off">
          <button type="submit" class="button">Send</button>
        </form>
      </div>
    </div>
    
    <footer class="footer">
      <p>Multiplayer Chess Game using Socket Programming &copy; 2025</p>
    </footer>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="/js/script.js"></script>
</body>
</html>
